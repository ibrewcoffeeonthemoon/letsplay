[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[project]
name = "letsplay"
version = "0.1.0"
description = "letsplay - A game launcher automation tool for Steam (potentially any other game launcher)"
authors = [
    { name = "Ibrewcoffee Onthemoon", email = "ibrewcoffeeonthemoon@gmail.com" }
]
dependencies = [
    "typer",
    "vdf>=3.4",
]
requires-python = ">=3.14.4"

[project.urls]
Homepage = "https://github.com/ibrewcoffeeonthemoon/letsplay"

[project.scripts]
letsplay = "letsplay:app"

[tool.pyright]
venvPath = "./"
venv = ".venv"

[tool.ruff.lint]
# Q = flake8-quotes (surgical string fixing)
# I = isort (import sorting)
# F401 = unused imports
select = ["Q", "I", "F401"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "single"
multiline-quotes = "single"

[tool.ruff.format]
quote-style = "single"
